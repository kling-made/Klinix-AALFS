[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "klinix"
version = "0.6.0"
description = "Advanced Automated Linux From Scratch"
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
license-files = ["LICENSE", "LICENSES/*.txt", "THIRD_PARTY_NOTICES.md"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
klinix = "klinix.cli:main"

[project.urls]
Repository = "https://github.com/kling-made/Klinix-AALFS"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"klinix.builder" = ["approvals.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
